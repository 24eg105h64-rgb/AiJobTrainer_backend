spring.config.import=optional:file:.env[.properties]
spring.application.name=AIJobTrainer
server.port=8080

# MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}

# Optional initial admin account
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Optional External AI API Configuration (Spring Boot calls this securely if provided)
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=${AI_API_URL:}
app.ai.model=${AI_MODEL:gemini-1.5-flash}
